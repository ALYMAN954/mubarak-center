<style>
/* Layout: one centred column. Navy header band with the two logos at the ends and a tool row beneath;
   cards per step; student cards for the teacher; tables for the supervisor. Four colour palettes switch via data-palette. */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface2:#eceffa; --ink:#1b1a3d; --muted:#5a5e86; --line:#d9dcee;
  --primary:#2f2d66; --on-primary:#ffffff; --accent:#4cc3e0; --accent-ink:#0d5a70;
  --ok:#1b7a4b; --ok-bg:#dff3e8; --warn:#8a5a00; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe2df;
  --band:#2f2d66; --band-ink:#ffffff; --fs:1;
  --font-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111128; --surface:#1a1a3b; --surface2:#232349; --ink:#eceefb; --muted:#a4a8d2; --line:#2f3162;
  --primary:#4cc3e0; --on-primary:#0b1030; --accent:#4cc3e0; --accent-ink:#7fdaf0;
  --ok:#6fd49b; --ok-bg:#16382a; --warn:#f0c768; --warn-bg:#3a2f12; --bad:#ff8f86; --bad-bg:#43191a;
  --band:#1a1a3b; --band-ink:#eceefb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111128; --surface:#1a1a3b; --surface2:#232349; --ink:#eceefb; --muted:#a4a8d2; --line:#2f3162;
  --primary:#4cc3e0; --on-primary:#0b1030; --accent:#4cc3e0; --accent-ink:#7fdaf0;
  --ok:#6fd49b; --ok-bg:#16382a; --warn:#f0c768; --warn-bg:#3a2f12; --bad:#ff8f86; --bad-bg:#43191a;
  --band:#1a1a3b; --band-ink:#eceefb; color-scheme:dark}
:root[data-palette="emerald"]{--bg:#f1f7f4;--surface2:#e6f1ec;--line:#d3e4dc;--muted:#4f6f62;--primary:#1f6b52;--accent:#34b58a;--accent-ink:#0f5a40;--band:#1f6b52}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="emerald"]{--bg:#0e1a16;--surface:#15251f;--surface2:#1c3129;--line:#29443a;--muted:#9fc2b4;--primary:#46c79b;--on-primary:#06231a;--accent:#46c79b;--accent-ink:#7fe0bd;--band:#15251f}}
:root[data-theme="dark"][data-palette="emerald"]{--bg:#0e1a16;--surface:#15251f;--surface2:#1c3129;--line:#29443a;--muted:#9fc2b4;--primary:#46c79b;--on-primary:#06231a;--accent:#46c79b;--accent-ink:#7fe0bd;--band:#15251f}
:root[data-palette="plum"]{--bg:#f8f3fa;--surface2:#f0e6f4;--line:#e3d3ea;--muted:#70567b;--primary:#5b2a6e;--accent:#b565d0;--accent-ink:#6f2f8a;--band:#5b2a6e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="plum"]{--bg:#1a1020;--surface:#251530;--surface2:#301c3d;--line:#432a52;--muted:#c3a6d0;--primary:#d49be8;--on-primary:#2a0f35;--accent:#d49be8;--accent-ink:#e6bff5;--band:#251530}}
:root[data-theme="dark"][data-palette="plum"]{--bg:#1a1020;--surface:#251530;--surface2:#301c3d;--line:#432a52;--muted:#c3a6d0;--primary:#d49be8;--on-primary:#2a0f35;--accent:#d49be8;--accent-ink:#e6bff5;--band:#251530}
:root[data-palette="sand"]{--bg:#faf6ec;--surface2:#f2ead4;--line:#e6dcc0;--muted:#7a6a45;--primary:#7a5a12;--accent:#d9a62e;--accent-ink:#6b4d0a;--band:#6b4d0a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="sand"]{--bg:#1b160a;--surface:#251e0f;--surface2:#31281a;--line:#463b24;--muted:#cbb78a;--primary:#e7bf5a;--on-primary:#2b1f03;--accent:#e7bf5a;--accent-ink:#f0d58a;--band:#251e0f}}
:root[data-theme="dark"][data-palette="sand"]{--bg:#1b160a;--surface:#251e0f;--surface2:#31281a;--line:#463b24;--muted:#cbb78a;--primary:#e7bf5a;--on-primary:#2b1f03;--accent:#e7bf5a;--accent-ink:#f0d58a;--band:#251e0f}

*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs))}
:root[data-fs="2"]{--fs:1.14}
:root[data-fs="3"]{--fs:1.28}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.9375rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
.wrap{max-width:1000px;margin:0 auto}
header.top{background:var(--band);color:var(--band-ink);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:16px;padding:6px;width:clamp(104px,26vw,150px);height:clamp(104px,26vw,150px);flex:none;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo.l2{width:clamp(88px,22vw,124px);height:clamp(88px,22vw,124px);padding:5px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.ttl{flex:1;min-width:0}
.ttl{text-align:center}
.ttl h1{font-size:1.6rem;line-height:1.3}
.ttl p{margin:4px 0 0;opacity:.9;font-size:1rem}
.ttl p.svline{margin-top:6px;min-height:1.6em}
.sv{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.16);color:var(--band-ink)}
.sv.saved::before{content:""}
.sv.saving{background:#f0c768;color:#3a2f12}
.sv.offline,.sv.error{background:#ff8f86;color:#43191a}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.tb{flex:1 1 60px;max-width:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:6px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--band-ink);font-size:.78rem;font-weight:600;cursor:pointer;line-height:1.2}
.tb:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.tb svg{width:26px;height:26px}
.tb .ic{font-size:1.45rem;line-height:26px;font-weight:700;height:26px}
.tb .dot{margin:0;width:22px;height:22px;border-width:2px}
@media (min-width:700px){.tb{flex-direction:row;gap:10px;min-height:54px;font-size:1rem;padding:8px 14px}}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;min-height:50px;font-size:1.02rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sm{padding:8px 16px;min-height:46px;font-size:.98rem}
.btn.danger{color:var(--bad)}
.btn.danger.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-inline-end:6px;border:1px solid rgba(255,255,255,.7)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
main>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:1.15rem;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.lbl{font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=password],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:50px;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.fld input,.fld select{min-width:0}
input[type=date]{min-width:0;max-width:100%}
input:disabled{opacity:.45}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);cursor:pointer}
.chk{min-height:36px;font-size:.95rem}
.chk input{width:24px;height:24px;accent-color:var(--primary)}
.day{background:var(--surface2);border-radius:8px;padding:9px 11px;min-height:42px;display:flex;flex-direction:column;justify-content:center;line-height:1.3}
.day small{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.choice{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:28px 24px;cursor:pointer;display:grid;gap:6px;min-height:140px;align-content:center}
.choice.big{display:flex;align-items:center;gap:20px;min-height:170px;padding:30px 26px}
.choice.big b{font-size:1.9rem}
.choice.big .ct{display:grid;gap:6px;min-width:0}
.choice.big .ct span{font-size:1.05rem}
.choice .ci{flex:none;width:76px;height:76px;border-radius:20px;background:var(--surface2);color:var(--primary);display:grid;place-items:center}
.choice .ci svg{width:40px;height:40px}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.choice b{font-family:var(--font-display);font-size:1.6rem;color:var(--primary)}
.choice span{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.9rem}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.login{max-width:420px;margin:30px auto 0;width:100%}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:6px 0 0}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.crumbs button{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:8px 6px;min-height:44px;text-decoration:underline;font-size:1rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:12px 22px;min-height:50px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:1.02rem}
.tab.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.sumline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.present,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.absent,.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.excused,.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.none{background:var(--surface2);color:var(--muted)}
.students{display:grid;gap:10px}
.stu{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;border-inline-start:6px solid var(--line)}
.stu.present{border-inline-start-color:var(--ok)}
.stu.absent{border-inline-start-color:var(--bad)}
.stu.excused{border-inline-start-color:var(--warn)}
.stu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu-name{flex:1;min-width:140px;text-align:start;background:none;border:0;cursor:pointer;font-weight:700;font-size:1.12rem;padding:10px 0;min-height:48px}
.sc{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{padding:14px 8px;min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:1.08rem}
.opt.present{color:var(--ok)} .opt.present.on{background:var(--ok-bg);border-color:var(--ok)}
.opt.absent{color:var(--bad)} .opt.absent.on{background:var(--bad-bg);border-color:var(--bad)}
.opt.excused{color:var(--warn)} .opt.excused.on{background:var(--warn-bg);border-color:var(--warn)}
.grades{display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:10px 18px;border-radius:99px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem;font-weight:600;min-height:48px}
.pill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill.na{opacity:.5;cursor:default;border-style:dashed}
.info{color:var(--muted);font-size:.85rem}
.missed{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:180px;direction:ltr;text-align:left}
.saved{position:fixed;inset-block-end:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));
  background:var(--primary);color:var(--on-primary);padding:6px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.saved.show{opacity:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th{background:var(--surface2);font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{padding:10px 14px;border-radius:8px}
.alerts .a{background:var(--bad-bg);color:var(--bad)}
.alerts .p{background:var(--warn-bg);color:var(--warn)}
.alerts .none{background:var(--ok-bg);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.inl{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.inl .fld{flex:1;min-width:150px}
select.mini{min-height:46px;padding:6px 10px;font-size:.95rem;width:auto;max-width:190px}
section[id^=sec-]{scroll-margin-top:12px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.sbox{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center;display:grid;gap:0;line-height:1.3}
.sbox b{font-family:var(--font-display);font-size:1.7rem}
.sbox span{font-size:.85rem;color:var(--muted)}
.sbox.present{background:var(--ok-bg);color:var(--ok)}.sbox.present span{color:var(--ok)}
.sbox.absent{background:var(--bad-bg);color:var(--bad)}.sbox.absent span{color:var(--bad)}
.sbox.excused{background:var(--warn-bg);color:var(--warn)}.sbox.excused span{color:var(--warn)}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.dock{display:none}
.undo{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:460px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.undo[hidden]{display:none}
.undo button{background:var(--bg);color:var(--ink);border:0;border-radius:10px;min-height:44px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.bars{display:flex;gap:10px;align-items:stretch;height:210px;overflow-x:auto;padding-top:20px}
.bcol{flex:1;min-width:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.bpair{display:flex;gap:3px;align-items:flex-end;height:calc(100% - 22px)}
.bpair i{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:2px;display:block}
.bpair em{position:absolute;top:-16px;inset-inline:-4px;text-align:center;font-style:normal;font-size:.68rem;color:var(--muted)}
.bcol>span{font-size:.72rem;color:var(--muted);text-align:center;height:18px}
.b1{background:var(--accent)} .b2{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.88rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:6px}
.cmp{display:grid;gap:16px}
.cmp .row{display:grid;gap:6px}
.cmp .hl{font-weight:700}
.cmp .hb{display:flex;align-items:center;gap:10px}
.cmp .tr{flex:1;height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.cmp .tr>i{display:block;height:100%;border-radius:7px}
.cmp .hb b{min-width:3.2em;font-size:.88rem;font-variant-numeric:tabular-nums}
.hint{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 16px}
.hint summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
.hint p{margin:0 0 10px;color:var(--muted)}
.choice.paused{opacity:.6}
.ayat{margin:36px auto 8px;max-width:640px;text-align:center;display:grid;gap:22px;padding:0 4px}
.ayat .q,.ayat .h{opacity:1}
.ayat .q{font-family:'Amiri Quran','Amiri',var(--font-display),serif;font-size:clamp(1.9rem,6vw,2.7rem);line-height:2;color:var(--primary)}
.ayat .h{font-family:'Amiri',var(--font-body),serif;font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:2;color:var(--ink)}
.ayat small{display:block;font-family:var(--font-body);font-size:.85rem;color:var(--muted);line-height:1.7;margin-top:2px}
.ayat hr{border:0;border-top:1px solid var(--line);width:80px;margin:0 auto}
.ayat.anim .q{animation:ay-flash 2.6s ease-out both}
.ayat.anim .h{animation:ay-flash 2.6s ease-out 1.9s both}
.ayat.anim hr{animation:ay-fade 1s ease-out 1.5s both}
@keyframes ay-flash{0%{opacity:0;text-shadow:0 0 0 transparent}12%{opacity:1;text-shadow:0 0 26px var(--primary)}26%{opacity:.25;text-shadow:0 0 6px var(--primary)}42%{opacity:1;text-shadow:0 0 22px var(--primary)}58%{opacity:.55;text-shadow:0 0 8px var(--primary)}76%{opacity:1;text-shadow:0 0 14px var(--primary)}100%{opacity:1;text-shadow:0 0 0 transparent}}
@keyframes ay-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ayat.anim .q,.ayat.anim .h,.ayat.anim hr{animation:none}}
.crow{display:grid;gap:6px}.crow .mv{display:flex;gap:6px;justify-content:flex-end}
textarea[readonly]{background:var(--bg)}
td.cw{background:var(--bad-bg);color:var(--bad);font-weight:700}
td.cs{background:var(--ok-bg);color:var(--ok);font-weight:700}
.chip .x{border:0;background:none;color:inherit;font-size:1.25rem;line-height:1;cursor:pointer;min-width:32px;min-height:32px;padding:0}
.pfx{display:flex;gap:10px;align-items:center}
.pfx span{white-space:nowrap;font-weight:700}
.tbl-note{font-size:.85rem;color:var(--muted);margin:8px 0 0}

const daysSince=ds=>Math.floor((Date.now()-parseISO(ds).getTime())/864e5);

const sig=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);

/* ---------- appearance (per viewer) ---------- */

/* ---------- data store: Supabase (shared) ---------- */
const S={cfg:{},teachers:{},sups:{},students:{},records:{},audit:{}};
let SB=null,SB2=null,ready=false,slow=false,writeBlocked=false,studentTok=null,pollT=null,rtOn=false;
let PUB={names:[],needsSetup:false,header:null};
const APPCFG=window.APP_CONFIG||{};
const APP_OK=!!(APPCFG.SUPABASE_URL&&APPCFG.SUPABASE_ANON_KEY&&!/YOUR_/.test(APPCFG.SUPABASE_URL+APPCFG.SUPABASE_ANON_KEY)&&window.supabase);
const MAIL='@tajweed-app.com';
const timers={},chains={};
const CFG=()=>S.cfg.main;
let saveSt='saved',inflight=0,undoFn=null,undoT=null,cfT=null,installEvt=null;
const failed={};
const SVTXT={saved:'تم الحفظ ✓',saving:'جاري الحفظ…',offline:'لا يوجد اتصال — لن يُحفظ ما تكتبه الآن',error:'تعذر الحفظ — تحقق من الاتصال'};
function setSave(st){saveSt=st;const el=$('#sv');if(el){el.className='sv '+st;el.textContent=SVTXT[st]}}
function flushAll(){const ks=Object.keys(timers).concat(Object.keys(failed));ks.forEach(k=>{const i=k.indexOf('/');flush(k.slice(0,i),k.slice(i+1))});
  if(ks.length) flashSaved('جاري الحفظ…'); else flashSaved('كل التغييرات محفوظة ✓')}
function showUndo(msg,fn){undoFn=fn;$('#undoMsg').textContent=msg;$('#undo').hidden=false;clearTimeout(undoT);undoT=setTimeout(hideUndo,8000)}
function hideUndo(){undoFn=null;const u=$('#undo');if(u)u.hidden=true}
function flashSaved(msg){const el=$('#saved');el.textContent=msg||'تم الحفظ';el.classList.add('show');clearTimeout(flashSaved.t);flashSaved.t=setTimeout(()=>el.classList.remove('show'),msg?2800:1200)}
const circleOf=(coll,d)=>coll==='students'?d.circleId:(coll==='records'||coll==='audit')?d.cid:null;
function touch(coll,id,delay){const key=coll+'/'+id;setSave(navigator.onLine?'saving':'offline');clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(coll,id),delay==null?350:delay)}
function flush(coll,id){
  const key=coll+'/'+id;clearTimeout(timers[key]);delete timers[key];delete failed[key];
  const data=S[coll][id];inflight++;
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    try{
      const r=data?await SB.from('docs').upsert({coll,id,circle_id:circleOf(coll,data),data:clone(data),updated_at:new Date().toISOString()})
                  :await SB.from('docs').delete().eq('coll',coll).eq('id',id);
      if(r.error) throw r.error;
      flashSaved();
    }catch(e){
      failed[key]=1;setSave(navigator.onLine?'error':'offline');
      if(e&&(e.code==='42501'||/row-level|permission/i.test(e.message||''))){writeBlocked=true;flashSaved('لا تملك صلاحية لهذا الإجراء')}
      else flashSaved('تعذر الحفظ، تحقق من الاتصال');
      render();
    }finally{inflight--;if(!inflight&&!Object.keys(timers).length&&!Object.keys(failed).length) setSave('saved')}
  });
  return chains[key];
}
function put(coll,id,data){S[coll][id]=data;touch(coll,id)}
function remove(coll,id){delete S[coll][id];touch(coll,id,0)}

async function fetchAll(coll){
  let out=[],from=0;
  for(;;){
    const {data,error}=await SB.from('docs').select('id,data').eq('coll',coll).range(from,from+999);
    if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000;
  }
  return out;
}
function mergeColl(coll,m){
  let ch=false;
  for(const id of Object.keys(S[coll])) if(!(id in m)&&!timers[coll+'/'+id]){delete S[coll][id];ch=true}
  for(const id of Object.keys(m)){if(timers[coll+'/'+id]) continue; if(sig(m[id])!==sig(S[coll][id])){S[coll][id]=m[id];ch=true}}
  return ch;
}
async function loadAll(){
  let ch=false;
  for(const c of ['cfg','students','records']){const m={};(await fetchAll(c)).forEach(r=>m[r.id]=r.data);ch=mergeColl(c,m)||ch}
  if(auth.s){
    const {data}=await SB.from('docs').select('id,data').eq('coll','audit').order('updated_at',{ascending:false}).limit(300);
    const m={};(data||[]).forEach(r=>m[r.id]=r.data);ch=mergeColl('audit',m)||ch;
  }
  const {data:ps,error}=await SB.from('profiles').select('*'); if(error) throw error;
  const T={},U={};
  (ps||[]).forEach(p=>{const o={id:p.id,name:p.name,circleIds:(Array.isArray(p.circle_ids)&&p.circle_ids.length)?p.circle_ids:(p.circle_id?[p.circle_id]:[]),mustChange:p.must_change,key:p.login_key};(p.role==='supervisor'?U:T)[p.id]=o});
  if(sig(T)!==sig(S.teachers)||sig(U)!==sig(S.sups)){S.teachers=T;S.sups=U;ch=true}
  return ch;
}
function subscribe(){
  if(rtOn) return; rtOn=true;
  try{SB.channel('rt-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!S[r.coll]) return;
    const key=r.coll+'/'+r.id; if(timers[key]) return;
    if(p.eventType==='DELETE'){if(S[r.coll][r.id]){delete S[r.coll][r.id];softRender()}}
    else if(sig(r.data)!==sig(S[r.coll][r.id])){S[r.coll][r.id]=r.data;softRender()}
  }).subscribe()}catch(e){}
  clearInterval(pollT);
  pollT=setInterval(()=>{if(auth.t||auth.s) loadAll().then(ch=>ch&&softRender()).catch(()=>{})},30000);
}

const circles=()=>((CFG()&&CFG().circles)||[]).map(c=>Object.assign({},c,{sec:c.sec||(c.cat==='arabic'?'lang':'taj'),grp:c.grp||c.name}));

function newMeta(){return {lesson:'',hifz:'',tilawa:'',matn:'',media:'',mediaOther:'',sheets:'',sheetsOther:'',noHif:false,noMtn:false,noHw:false,notes:''}}
function getRec(cid,date,create){
  const k=recKey(cid,date);

  return S.records[k]||{cid,date,meta:newMeta(),rows:{}};
}

/* scoring: recitation 5, memorisation 2, matn 2, homework 1; marks of a not-required item move to recitation */
function maxRec(m){return 5+(m.noHif?2:0)+(m.noMtn?2:0)+(m.noHw?1:0)}
function score(row,m){
  const rec=row.rec?maxRec(m):0, hif=m.noHif?0:(row.hif?2:0), mtn=m.noMtn?0:(row.mtn?2:0), hw=m.noHw?0:(row.hw?1:0);
  return {rec,hif,mtn,hw,total:rec+hif+mtn+hw};
}
function statOf(s,ses){
  const o={s,present:0,absent:0,excused:0,sum:0,comp:{rec:[0,0],hif:[0,0],mtn:[0,0],hw:[0,0]}};
  ses.forEach(r=>{const row=(r.rows||{})[s.id];if(!row||!row.att)return;o[row.att]++;
    if(row.att==='present'){const m=r.meta||{};o.sum+=score(row,m).total;
      o.comp.rec[1]++;if(row.rec)o.comp.rec[0]++;
      if(!m.noHif){o.comp.hif[1]++;if(row.hif)o.comp.hif[0]++}
      if(!m.noMtn){o.comp.mtn[1]++;if(row.mtn)o.comp.mtn[0]++}
      if(!m.noHw){o.comp.hw[1]++;if(row.hw)o.comp.hw[0]++}}});
  const n=o.present+o.absent+o.excused;
  o.avg=o.present?o.sum/o.present:null;
  o.attPct=n?Math.round(o.present/n*100):null;
  o.cp={};COMP.forEach(([k])=>{const c=o.comp[k];o.cp[k]=c[1]?Math.round(c[0]/c[1]*100):null});
  return o;
}
function strengths(o){const st=settings(),weak=[],strong=[];COMP.forEach(([k,l])=>{const p=o.cp[k];if(p==null)return;if(p<st.weakLimit)weak.push(l);else if(p>=st.strongLimit)strong.push(l)});return {weak,strong}}
function courseComp(sts){const a={rec:[0,0],hif:[0,0],mtn:[0,0],hw:[0,0]};sts.forEach(o=>COMP.forEach(([k])=>{a[k][0]+=o.comp[k][0];a[k][1]+=o.comp[k][1]}));const p={};COMP.forEach(([k])=>p[k]=a[k][1]?Math.round(a[k][0]/a[k][1]*100):null);return p}
const cellC=p=>{const st=settings();return `<td class="${p==null?'':p<st.weakLimit?'cw':p>=st.strongLimit?'cs':''}">${p==null?'—':p+'%'}</td>`};
const statsOf=cid=>{const ses=sessionsOf(cid);return studentsOf(cid).map(s=>statOf(s,ses))};
function alertsOf(cid){
  const st=settings(),out=[];
  statsOf(cid).forEach(o=>{
    if(o.absent>=st.absLimit) out.push({t:'a',m:`الطالب ${o.s.name} غاب ${o.absent} مرات، وهذا يبلغ حد التنبيه (${st.absLimit}) أو يتجاوزه.`});
    if(o.avg!=null&&o.avg<st.avgLimit) out.push({t:'p',m:`معدل درجات الطالب ${o.s.name} ${f1(o.avg)} من 10، وهو أقل من ${f1(st.avgLimit)}.`});
  });
  return out;
}
function lateInfo(c){
  const th=c.freq==='daily'?1:7, s=sessionsOf(c.id)[0], d=s?daysSince(s.date):null;
  return {late:d===null||d>th,days:d,last:s?s.date:null,th};
}
function missedFor(s,cid,date){
  const out=[];
  for(const r of sessionsOf(cid)){
    if(r.date>=date) continue; const row=r.rows[s.id]; if(!row||!row.att) continue;
    if(row.att==='present') break; out.push(r); if(out.length>=3) break;
  }
  return out;
}

function teacherRoute(t){view.date=iso(new Date());if(t.mustChange)return 'tChange';const ids=teacherCids(t);if(ids.length===1)view.cid=ids[0];return ids.length===1?'tHome':'tPick'}

function renderStudents(){

  if(ts) ts.innerHTML=`<div class="sumgrid"><div class="sbox present"><b>${cnt.present}</b><span>حضور</span></div><div class="sbox absent"><b>${cnt.absent}</b><span>غياب</span></div><div class="sbox excused"><b>${cnt.excused}</b><span>استئذان</span></div><div class="sbox"><b>${Math.max(0,tot-done)}</b><span>لم يُسجَّل</span></div><div class="sbox"><b>${avg}</b><span>معدل الدرجات</span></div></div>

/* ---------- charts ---------- */
function sessStat(r){let p=0,n=0,sum=0;Object.values(r.rows||{}).forEach(x=>{if(!x.att)return;n++;if(x.att==='present'){p++;sum+=score(x,r.meta).total}});return {att:n?Math.round(p/n*100):null,avg:p?Math.round(sum/p*10)/10:null}}
function trendChart(ses){
  const a=ses.slice(0,12).reverse();
  if(a.length<2) return '<p class="info" style="margin:0">يلزم جلستان مسجلتان على الأقل لعرض الرسم.</p>';
  return `<div class="bars" role="img" aria-label="رسم بياني لنسبة الحضور ومتوسط الدرجات في آخر الجلسات">${a.map(r=>{const t=sessStat(r);
   return `<div class="bcol"><div class="bpair"><i class="b1" style="height:${t.att||0}%"><em>${t.att==null?'':t.att}</em></i><i class="b2" style="height:${(t.avg||0)*10}%"><em>${t.avg==null?'':t.avg}</em></i></div><span>${r.date.slice(5)}</span></div>`}).join('')}</div>
   <div class="legend"><span><i class="b1"></i>نسبة الحضور %</span><span><i class="b2"></i>معدل الدرجات (من 10)</span></div>`;
}
function cmpChart(rows){
  if(!rows.length) return '<p class="info" style="margin:0">لا توجد دورات نشطة بعد.</p>';
  const bar=(v,cl,sc)=>`<div class="hb"><div class="tr"><i class="${cl}" style="width:${sc?(v||0)*10:(v||0)}%"></i></div><b>${v==null?'—':sc?f1(v)+'/10':v+'%'}</b></div>`;
  return `<div class="cmp">${rows.map(r=>`<div class="row"><span class="hl">${esc(r.c.name)}</span>${bar(r.att,'b1')}${bar(r.avg,'b2',1)}</div>`).join('')}</div>
   <div class="legend"><span><i class="b1"></i>نسبة الحضور %</span><span><i class="b2"></i>معدل الدرجات (من 10)</span></div>`;
}

function dlSave(filename,data){
  const type=/\.pdf$/.test(filename)?'application/pdf':/\.xlsx$/.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  flashSaved('تم التصدير');
}

    CATALOG.forEach(([sec,grp,name])=>{const k=normAr(name);if(!have.has(k)){const c={id:uid('c'),sec,grp,name,freq:'weekly'};list.push(c);have.set(k,c);added++}idBy[k]=have.get(k).id});

async function clearData(){
  const scope=$('#cl-scope').value, what=$('#cl-what').value, before=$('#cl-before').value;
  if($('#cl-text').value.trim()!=='حذف'){flashSaved('اكتب كلمة «حذف» في خانة التأكيد أولاً');return}
  const inScope=cid=>scope==='all'||cid===scope;
  const dated=!!before&&what==='sess';
  const plan={records:[],audit:[],students:[]};
  Object.entries(S.records).forEach(([id,r])=>{if(inScope(r.cid)&&(!dated||r.date<=before)) plan.records.push(id)});
  Object.entries(S.audit).forEach(([id,a])=>{if(inScope(a.cid)&&(!dated||(a.date&&a.date<=before))) plan.audit.push(id)});
  if(what==='all') Object.entries(S.students).forEach(([id,s])=>{if(inScope(s.circleId)) plan.students.push(id)});
  let fail=0;
  const run=async(coll,ids)=>{
    if(!ids.length&&!(coll==='audit'&&!dated)) return;
    ids.forEach(id=>{clearTimeout(timers[coll+'/'+id]);delete timers[coll+'/'+id]});
    if(!dated||coll==='students'){
      let q=SB.from('docs').delete().eq('coll',coll); if(scope!=='all') q=q.eq('circle_id',scope);
      const {error}=await q; if(error) fail++;
    } else for(let i=0;i<ids.length;i+=50){const {error}=await SB.from('docs').delete().eq('coll',coll).in('id',ids.slice(i,i+50)); if(error) fail++}
  };
  flashSaved('جاري الحذف…');
  await run('records',plan.records);await run('audit',plan.audit);await run('students',plan.students);
  await loadAll();ui.cl=null;render();
  flashSaved(fail?'تعذر حذف بعض البيانات':`تم الحذف: ${plan.records.length} جلسة، ${plan.students.length} طالباً`);
}

async function closeTerm(){
  const label=$('#ct-label').value.trim(),keep=$('#ct-keep').value;
  if($('#ct-text').value.trim()!=='إغلاق'){flashSaved('اكتب كلمة «إغلاق» للتأكيد');return}
  if(!label){flashSaved('اكتب اسم الفصل');return}
  Object.keys(timers).forEach(k=>{const i=k.indexOf('/');flush(k.slice(0,i),k.slice(i+1))});
  await Promise.all(Object.values(chains));
  const tid='t'+Date.now().toString(36),h=header(),rows=[];
  circles().forEach(c=>{
    const students=studentsOf(c.id,true),records=Object.values(S.records).filter(r=>r.cid===c.id);
    if(!students.length&&!records.length) return;
    rows.push({coll:'archive',id:tid+'_'+c.id,circle_id:null,data:{term:{id:tid,label,closedAt:Date.now(),fasl:faslOf(h),year:h.year||''},cid:c.id,circleName:c.name,teachers:teacherOf(c.id).map(t=>t.name).join('، '),students:clone(students),records:clone(records)}});
  });
  if(!rows.length){flashSaved('لا توجد بيانات لأرشفتها');return}
  flashSaved('جاري الأرشفة…');
  for(let i=0;i<rows.length;i+=3){
    const {error}=await SB.from('docs').upsert(rows.slice(i,i+3));
    if(error){flashSaved('تعذرت الأرشفة ولم يُحذف شيء');return}
  }
  const colls=keep==='none'?['records','audit','students']:['records','audit'];let fail=0;
  for(const coll of colls){
    Object.keys(timers).filter(k=>k.startsWith(coll+'/')).forEach(k=>{clearTimeout(timers[k]);delete timers[k]});
    const {error}=await SB.from('docs').delete().eq('coll',coll);if(error) fail++;
  }
  await loadAll();ui.archives=null;render();
  flashSaved(fail?'أُرشف الفصل لكن تعذر حذف بعض البيانات':'أُرشف الفصل وبدأت صفحة جديدة');
}

function bulkPlan(rows){
  const list=parseStuRows(rows,true);
  if(!list.hasHeader||!list.hasCourse) return {error:'لم أجد صف العناوين. يجب أن يحتوي الملف على عمودي «الدورة» و«الاسم» في الصف الأول (استخدم القالب).'};
  const byKey=new Map(circles().map(c=>[cKey(c.name),c])),per=new Map(),unknown=[],seen=new Map();
  list.forEach((o,i)=>{
    const c=byKey.get(cKey(o.course||''));
    if(!c){unknown.push({n:i+2,name:o.name,course:o.course||'(فارغ)'});return}
    let p=per.get(c.id);if(!p){p={c,add:[],dup:0};per.set(c.id,p)}
    let set=seen.get(c.id);if(!set){set=new Set(studentsOf(c.id,true).map(x=>normAr(x.name)));seen.set(c.id,set)}
    const k=normAr(o.name);if(set.has(k)){p.dup++;return}set.add(k);p.add.push(o);
  });
  return {per:[...per.values()],unknown,total:list.length};
}

  else if(act==='importcopy'){const r=ui.importRes;if(r){const txt=['الأستاذ\tالدورات\tكلمة السر المؤقتة'].concat(r.out.map(x=>[x.name,x.ids.map(id=>(circ(id)||{name:''}).name).join('، '),x.pw||'(موجود مسبقاً)'].join('\t'))).join('\n');
    try{navigator.clipboard.writeText(txt).then(()=>flashSaved('نُسخ الجدول'),()=>flashSaved('تعذر النسخ'))}catch(x){flashSaved('تعذر النسخ')}}}
  else if(act==='importpdf'){const r=ui.importRes;if(r) pdfFrom(`${repHead()}<h3>حسابات الأساتذة وكلمات السر المؤقتة</h3><p>سلّم كل أستاذ كلمته بشكل خاص، وسيُطلب منه تغييرها عند أول دخول.</p><table><thead><tr><th>الأستاذ</th><th>الدورات</th><th>كلمة السر المؤقتة</th></tr></thead><tbody>${r.out.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.ids.map(id=>(circ(id)||{name:''}).name).join('، '))}</td><td dir="ltr" style="text-align:right"><b>${x.pw?esc(x.pw):'—'}</b></td></tr>`).join('')}</tbody></table>`,'كلمات-سر-الأساتذة.pdf',false)}
  else if(act==='cleardo') clearData();
  else if(act==='spdfc') strengthPdf(sup.cid);
  else if(act==='spdfall') strengthAllPdf();
  else if(act==='tdel'){const {error}=await SB.rpc('admin_delete_user',{uid:b.dataset.id});if(error)flashSaved('تعذر الحذف');await refreshAdmin()}
  else if(act==='treset'){ui.resetId=ui.resetId===b.dataset.id?null:b.dataset.id;render()}
  else if(act==='supdel'){const {error}=await SB.rpc('admin_delete_user',{uid:b.dataset.id});if(error)flashSaved('تعذر الحذف');await refreshAdmin()}
  else if(act==='expall') exportAllStudents();
  else if(act==='tpl') downloadTemplate();
  else if(act==='bulkcancel'){ui.bulk=null;render()}
  else if(act==='bulkok'){const b=ui.bulk;if(b&&b.per){let n=0;b.per.forEach(p=>p.add.forEach(o=>{const id=uid('s'),v=Object.assign({},o);delete v.course;
      put('students',id,Object.assign({id,circleId:p.c.id,active:true,token:newToken(),idno:'',email:'',phone:'',gphone:'',work:'',degree:''},v));n++}));
    ui.bulk=null;render();flashSaved('أُضيف '+n+' طالباً')}}
  else if(act==='imptoggle'){ui.impStu=!ui.impStu;render()}
  else if(act==='selall'){ui.sel={cid:sup.cid,ids:{}};studentsOf(sup.cid).forEach(x=>ui.sel.ids[x.id]=1);render()}
  else if(act==='certall'){const hs=statsOf(sup.cid).filter(o=>o.attPct!=null&&o.attPct>=settings().passAtt).map(o=>certHTML(o.s.id)).filter(Boolean);
    if(!hs.length){flashSaved('لا يوجد طلاب مستحقون للشهادة');return} pdfMulti(hs,'شهادات-'+circ(sup.cid).name+'.pdf',true)}
  else if(act==='gsgo'){const x=S.students[b.dataset.sid],c=x&&circ(x.circleId);if(c){sup.sec=c.sec;sup.grp=c.grp;sup.cid=c.id;sup.linkFor=null;ui.gs='';render()}}
  else if(act==='cmove'){const l=famCourses(sup.sec,sup.grp).map(x=>x.id),i=l.indexOf(b.dataset.v),j=i+(+b.dataset.d);
    if(i>=0&&j>=0&&j<l.length){const cf=CFG(),a=cf.circles.findIndex(x=>x.id===l[i]),z=cf.circles.findIndex(x=>x.id===l[j]);
      if(a>=0&&z>=0){const t=cf.circles[a];cf.circles[a]=cf.circles[z];cf.circles[z]=t;put('cfg','main',cf);render()}}}
  else if(act==='remind'){const c=circ(b.dataset.cid),i=lateInfo(c),tn=teacherOf(c.id).map(x=>x.name).join('، ');
    ui.remind=`السلام عليكم ورحمة الله وبركاته\nأستاذنا الفاضل${tn?' '+tn:''}، نذكّركم بتسجيل جلسة دورة «${c.name}» في تطبيق متابعة الدورات${i.last?' (آخر جلسة مسجلة بتاريخ '+i.last+')':''}.\nجزاكم الله خيراً.`;render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(act==='remindcopy'){try{navigator.clipboard.writeText(ui.remind).then(()=>flashSaved('نُسخت الرسالة'),()=>flashSaved('حدّد النص وانسخه يدوياً'))}catch(x){flashSaved('حدّد النص وانسخه يدوياً')}}
  else if(act==='remindclose'){ui.remind=null;render()}
  else if(act==='eotpdf') pdfFrom(termReportHTML(liveRows(),'تقرير نهاية الفصل',termLine()),'تقرير-نهاية-الفصل.pdf',true)
  else if(act==='closeterm') closeTerm();
  else if(act==='arcload') loadArchives();
  else if(act==='arcpdf'){const g=arcGroups().find(x=>x.term.id===b.dataset.id);if(g) pdfFrom(termReportHTML(archRows(g.items),'تقرير فصل مؤرشف: '+g.term.label,'أُغلق في '+fmtTs(g.term.closedAt)),'تقرير-'+g.term.label+'.pdf',true)}
  else if(act==='arcdel'){const g=arcGroups().find(x=>x.term.id===b.dataset.id);if(g){const {error}=await SB.from('docs').delete().eq('coll','archive').in('id',g.ids);if(error)flashSaved('تعذر الحذف');await loadArchives()}}
  else if(act==='cpause'){const cf=CFG(),x=cf.circles.find(y=>y.id===sup.cid);if(x){x.paused=!x.paused;put('cfg','main',cf);flashSaved(x.paused?'أُوقفت الدورة مؤقتاً':'فُعّلت الدورة');render()}}
  else if(act==='trename'){ui.renameId=ui.renameId===b.dataset.id?null:b.dataset.id;render()}
  else if(act==='cdel'){const c=CFG();c.circles=c.circles.filter(x=>x.id!==sup.cid);put('cfg','main',c);sup.cid=null;if(sup.sec&&sup.grp&&!famCourses(sup.sec,sup.grp).length)sup.grp=null;render()}
  else if(act==='xlsx') exportXlsx(sup.cid);
  else if(act==='pdf') exportPdf(sup.cid);
  else if(act==='bak') backup();
  else if(act==='restoreok'){doRestore(ui.confirmRestore.data)}
  else if(act==='restorecancel'){ui.confirmRestore=null;render()}
});
document.addEventListener('input',e=>{

  else if(el.dataset.q){ui.q=el.value;renderStudents()}
  else if(el.dataset.m){const r=ensureRec();r.meta[el.dataset.m]=el.value;touchRec(r)}
  else if(el.dataset.h){const c=CFG();c.header=Object.assign({},c.header,{[el.dataset.h]:el.value});touch('cfg','main');const t=$('#term');if(t)t.innerHTML=termText()}
  else if(el.dataset.note){const r=ensureRec(),sid=el.dataset.note;r.rows[sid]=Object.assign({att:'',rec:false,hif:false,mtn:false,hw:false},r.rows[sid],{note:el.value});touchRec(r)}
  else if(el.dataset.cname){const c=CFG(),x=c.circles.find(y=>y.id===el.dataset.cname);if(x&&el.value.trim()){if(!x.grp||x.grp===x.name)x.grp=el.value.trim();x.name=el.value;touch('cfg','main')}}

document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.bulkfile!==undefined){const f=el.files&&el.files[0];if(!f)return;
    if(typeof XLSX==='undefined'){flashSaved('تعذر تحميل مكتبة Excel');return}
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const pl=bulkPlan(rows);ui.bulk=Object.assign({file:f.name},pl)}catch(x){ui.bulk={error:'تعذرت قراءة الملف.'}}
    el.value='';render()}
  else if(el.dataset.pick){if(!ui.sel||ui.sel.cid!==sup.cid) ui.sel={cid:sup.cid,ids:{}};if(el.checked) ui.sel.ids[el.dataset.pick]=1;else delete ui.sel.ids[el.dataset.pick]}
  else if(el.dataset.bulkmv!==undefined){const ids=(ui.sel&&ui.sel.cid===sup.cid)?Object.keys(ui.sel.ids):[],dest=el.value;
    if(!dest){return}
    if(!ids.length){flashSaved('حدّد الطلاب أولاً');render();return}
    const from=sup.cid;ids.forEach(id=>{const x=S.students[id];if(x){x.circleId=dest;put('students',id,x)}});ui.sel=null;render();
    showUndo('نُقل '+ids.length+' طالباً',()=>{ids.forEach(id=>{const x=S.students[id];if(x){x.circleId=from;put('students',id,x)}});render()})}
  else if(el.dataset.act==='date'&&el.value){view.date=el.value;ui.open=null;render()}
  else if(el.dataset.w){sup[el.dataset.w]=el.value}
  else if(el.dataset.c){const r=ensureRec();r.meta[el.dataset.c]=el.checked;touchRec(r);render()}
  else if(el.dataset.sel==='media'||el.dataset.sel==='sheets'){
    const f=el.dataset.sel,r=ensureRec();r.meta[f]=el.value;touchRec(r);
    const o=$('#'+f+'Other');o.hidden=el.value!=='أخرى';if(!o.hidden)o.focus()}
  else if(el.dataset.sel==='deg'){const o=$('#'+el.id.replace('-deg','-degOther'));o.hidden=el.value!=='غير ذلك';if(!o.hidden)o.focus()}
  else if(el.dataset.lim){const k=el.dataset.lim,mx=k==='absLimit'?99:k==='avgLimit'?10:100;let v=k==='avgLimit'?parseFloat(el.value):parseInt(el.value);if(!(v>=1))v=1;v=Math.min(v,mx);
    const c=CFG(),nx=Object.assign({},settings(),{[k]:v});
    if(nx.strongLimit<=nx.weakLimit){flashSaved('حد «قوي» يجب أن يكون أكبر من حد «ضعيف»');render();return}
    c.settings=nx;put('cfg','main',c);render()}
  else if(el.dataset.addc&&el.value){const x=S.teachers[el.dataset.addc],cid=el.value;if(x&&!teacherAll(x).includes(cid)&&await setTeacherCircles(x.id,teacherAll(x).concat([cid]))) await refreshAdmin();else render()}
  else if(el.dataset.mv&&el.value){const s=S.students[el.dataset.mv];s.circleId=el.value;put('students',s.id,s);render();flashSaved('نُقل الطالب')}
  else if(el.id==='rf'&&el.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=='tajweed') throw 0;
      const n=['cfg','students','records','audit'].reduce((a,k)=>a+Object.keys(d[k]||{}).length,0);
      ui.confirmRestore={data:d,n};render()}catch(x){flashSaved('الملف غير صالح')}};
    rd.readAsText(el.files[0]);
  }
});
const pwOk=p=>p&&p.length>=6;
const PWMSG='كلمة السر قصيرة. اكتب 6 أحرف على الأقل.';
async function createAccount(name,pw,role,circleIds){
  const key=newKey();
  const r=await SB2.auth.signUp({email:key+MAIL,password:pw});
  if(r.error||!r.data||!r.data.user) return {error:(r.error&&r.error.message)||'تعذر إنشاء الحساب'};
  const row={id:r.data.user.id,login_key:key,role,name,must_change:role==='teacher'};
  if(circleIds&&circleIds.length){row.circle_ids=circleIds;row.circle_id=circleIds[0]}
  const ins=await SB.from('profiles').insert(row);
  return ins.error?{error:ins.error.message}:{ok:true};
}
document.addEventListener('submit',async e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  const err=m=>{ui.err=m;const x=$('#err');if(x)x.textContent=m};
  const btn=e.target.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  try{
  if(f==='setup'){
    const n=$('#su-name').value.trim(),p=$('#su-pw').value,p2=$('#su-pw2').value;
    if(!pwOk(p)) return err(PWMSG);
    if(p!==p2) return err('كلمتا السر غير متطابقتين.');
    const key=newKey(),email=key+MAIL;
    const su=await SB.auth.signUp({email,password:p});
    if(su.error) return err('تعذر إنشاء الحساب: '+su.error.message);
    if(!su.data.session){const si=await SB.auth.signInWithPassword({email,password:p});if(si.error) return err('عطّل خيار تأكيد البريد في إعدادات Supabase (انظر README) ثم أعد المحاولة.')}
    const cl=await SB.rpc('claim_first_supervisor',{p_name:n,p_key:key});
    if(cl.error){await SB.auth.signOut();await refreshPublic();return err('تم إعداد النظام مسبقاً.')}
    const cf=await SB.from('docs').upsert({coll:'cfg',id:'main',circle_id:null,data:{header:{fasl:'',year:hijriYear()},settings:{absLimit:3,avgLimit:6,passAtt:75,weakLimit:65,strongLimit:85},circles:clone(DEF_CIRCLES)}});
    if(cf.error) return err('تعذر حفظ الإعدادات: '+cf.error.message);
    const p0=await enterSession();ui.err='';if(p0){routeAfterLogin(p0)}render();
  } else if(f==='tlogin'||f==='slogin'){
    const key=$('#who').value,pw=$('#pw').value;
    if(!pw) return err('اكتب كلمة السر.');
    const si=await SB.auth.signInWithPassword({email:key+MAIL,password:pw});
    if(si.error) return err('كلمة السر غير صحيحة.');
    const p0=await enterSession();
    if(!p0||(f==='tlogin')!==(p0.role==='teacher')){await signOutAll();view.screen=f==='tlogin'?'tLogin':'sLogin';return err('هذا الحساب لا يتبع هذه الصفحة.')}
    routeAfterLogin(p0);render();
  } else if(f==='change-t'||f==='change-s'){
    const p=$('#np1').value,p2=$('#np2').value;
    if(!pwOk(p)) return err(PWMSG);
    if(p!==p2) return err('كلمتا السر غير متطابقتين.');
    const up=await SB.auth.updateUser({password:p});
    if(up.error) return err('تعذر تغيير كلمة السر: '+up.error.message);
    if(f==='change-t'){await SB.rpc('clear_must_change');const t=S.teachers[auth.t];t.mustChange=false;view.cid=null;view.screen=teacherRoute(t)}
    else view.screen='sHome';
    ui.err='';render();flashSaved('تم تغيير كلمة السر');
  } else if(f==='addstu'){
    const v=stuVals('n'); if(!v.name) return;
    const cid=curCid(); if(!cid) return;
    const id=uid('s');put('students',id,Object.assign({id,circleId:cid,active:true,token:newToken()},v));
    ui.addStudent=false;render();
  } else if(f==='editstu'){
    const id=e.target.dataset.id,s=S.students[id],v=stuVals('e'); if(!s||!v.name) return;
    put('students',id,Object.assign({},s,v));ui.editStu=null;render();flashSaved('تم تعديل بيانات الطالب');
  } else if(f==='addteacher'||f==='addsup'){
    const isT=f==='addteacher',name=$(isT?'#tn-name':'#sn-name').value.trim(),p=$(isT?'#tn-pass':'#sn-pass').value.trim();
    if(!pwOk(p)){flashSaved(PWMSG);return err(PWMSG)}
    const cc=isT?$('#tn-circ').value:'';
    const r=await createAccount(name,p,isT?'teacher':'supervisor',cc?[cc]:null);
    if(r.error) return err('تعذر الإضافة: '+r.error);
    ui.err='';await refreshAdmin();flashSaved('تمت الإضافة');
  } else if(f==='impstu'){
    const cid=targetCid(); if(!cid) return;
    let rows=[];const fi=$('#imp-f'),tx=$('#imp-t').value;
    if(fi&&fi.files[0]){
      if(typeof XLSX==='undefined') return err('تعذر تحميل مكتبة Excel، تحقق من الاتصال.');
      try{const wb=XLSX.read(await fi.files[0].arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(x){return err('تعذرت قراءة الملف.')}
    } else rows=tx.split(/\r?\n/).map(l=>l.split(/\t|،|,|;|؛/));
    const list=parseStuRows(rows).slice(0,500);
    if(!list.length) return err('لم أجد أسماء. اكتب اسماً في كل سطر.');
    const have=new Set(studentsOf(cid,true).map(x=>normAr(x.name)));let add=0,skip=0;
    list.forEach(o=>{const k=normAr(o.name);if(have.has(k)){skip++;return}have.add(k);const id=uid('s');
      put('students',id,Object.assign({id,circleId:cid,active:true,token:newToken(),idno:'',email:'',phone:'',gphone:'',work:'',degree:''},o));add++});
    ui.impStu=false;render();flashSaved('أُضيف '+add+' طالباً'+(skip?'، وتُخطّي '+skip+' مكرراً':''));
  } else if(f==='trenamedo'){
    const id=e.target.dataset.id,nm=$('#rn').value.trim();if(!nm) return;
    const r=await SB.from('profiles').update({name:nm}).eq('id',id);
    if(r.error){flashSaved('تعذر تعديل الاسم');return}
    ui.renameId=null;await refreshAdmin();await refreshPublic();flashSaved('تم تعديل الاسم');
  } else if(f==='tresetdo'){
    const id=e.target.dataset.id,p=$('#rp').value.trim();
    if(!pwOk(p)){flashSaved(PWMSG);return}
    const r=await SB.rpc('admin_set_password',{uid:id,pw:p});
    if(r.error){flashSaved('تعذر إعادة التعيين');return}
    ui.resetId=null;await refreshAdmin();flashSaved('أُعيد تعيين كلمة السر');
  } else if(f==='cadd'){
    const name=$('#c-name').value.trim();if(!name) return;
    if(!sup.sec) return;
    const gi=$('#c-grp'),grp=sup.grp||(gi&&gi.value.trim())||name;
    const c=CFG(),nc={id:uid('c'),sec:sup.sec,grp,name,freq:'weekly'};c.circles=c.circles.concat([nc]);put('cfg','main',c);
    if(!sup.grp&&famCourses(sup.sec,grp).length===1){} render();
  }
  }finally{if(btn)btn.disabled=false}
});

/* ---------- start ---------- */
async function boot(){
  const h=location.hash; if(h.startsWith('#me-')) studentTok=h.slice(4);
  if(!APP_OK){ready=true;render();return}
  SB=window.supabase.createClient(APPCFG.SUPABASE_URL,APPCFG.SUPABASE_ANON_KEY);
  SB2=window.supabase.createClient(APPCFG.SUPABASE_URL,APPCFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'tajweed-tmp'}});
  render();
  setTimeout(()=>{if(!ready){slow=true;render()}},10000);
  try{
    if(studentTok){
      const {data}=await SB.rpc('student_view',{tok:studentTok});
      if(data){S.cfg.main=data.cfg;S.students[data.student.id]=data.student;(data.records||[]).forEach(r=>S.records[r.id]=r.data)}
      ready=true;render();return;
    }
    await refreshPublic();
    const p=await enterSession();
    if(p) routeAfterLogin(p);
  }catch(e){slow=true}
  ready=true;render();
}
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
boot();
